<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اصنع هديتك 🎁</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe6f2, #f3e5ff);
            text-align: center;
            padding: 30px;
            direction: rtl;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #9b59b6;
        }

        input, textarea {
            width: 90%;
            padding: 14px;
            margin: 10px;
            border: 2px solid #ead5f5;
            border-radius: 15px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            background: #9b59b6;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 25px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #8e44ad;
        }

        #preview {
            display: none;
            width: 90%;
            max-height: 250px;
            object-fit: cover;
            margin: 15px auto;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>اصنعي هديتك 🎁💗</h1>

        <input type="text" id="name" placeholder="اسم الشخص 🎀">

        <input type="text" id="occasion" placeholder="مناسبة الهدية 🎉">

        <textarea id="message" placeholder="اكتبي رسالتك 💌"></textarea>

        <input type="file" id="photo" accept="image/*">

        <img id="preview">

        <br>

        <button onclick="createGift()">إنشاء الهدية 🎁</button>

    </div>

    <script>
        const photoInput = document.getElementById("photo");
        const preview = document.getElementById("preview");

        photoInput.addEventListener("change", function () {
            const file = this.files[0];

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        });

        function createGift() {
            const name = document.getElementById("name").value;
            const occasion = document.getElementById("occasion").value;
            const message = document.getElementById("message").value;

            const url =
                "gift.html?name=" + encodeURIComponent(name) +
                "&occasion=" + encodeURIComponent(occasion) +
                "&message=" + encodeURIComponent(message);

            window.location.href = url;
        }
    </script>

</body>
</html>
