<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة 🎁</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ffe6f2, #f3e5ff);
            padding: 30px;
        }

        .box {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px #0002;
        }

        h1 {
            color: #9b59b6;
        }

        input, textarea {
            width: 90%;
            box-sizing: border-box;
            padding: 14px;
            margin: 10px;
            border: 2px solid #ead5f5;
            border-radius: 15px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            background: #9b59b6;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            font-size: 17px;
            cursor: pointer;
            margin: 10px;
        }

        #gift {
            display: none;
        }

        #message {
            font-size: 20px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="box">

    <!-- إنشاء الهدية -->
    <div id="create">

        <h1>اصنعي هديتك 🎁</h1>

        <input id="name" type="text" placeholder="اسم الشخص 🎀">

        <input id="password" type="password" placeholder="الباسورد 🔐">

        <textarea id="messageInput"
                  placeholder="اكتبي رسالتك 💌"></textarea>

        <button onclick="makeGift()">
            إنشاء الهدية 🎁
        </button>

    </div>


    <!-- فتح الهدية -->
    <div id="open" style="display:none;">

        <h1>🎁 عندك هدية!</h1>

        <input id="passwordCheck"
               type="password"
               placeholder="اكتبي الباسورد 🔐">

        <button onclick="openGift()">
            فتح الهدية 💗
        </button>

    </div>


    <!-- الرسالة -->
    <div id="gift">

        <h1>💝 هدية خاصة</h1>

        <h2 id="nameShow"></h2>

        <p id="message"></p>

        <button onclick="shareGift()">
            مشاركة الهدية 💌
        </button>

    </div>

</div>


<script>

let giftName = "";
let giftPassword = "";
let giftMessage = "";


function makeGift() {

    giftName = document.getElementById("name").value;
    giftPassword = document.getElementById("password").value;
    giftMessage = document.getElementById("messageInput").value;

    if (!giftName || !giftPassword || !giftMessage) {
        alert("اكتبي الاسم والباسورد والرسالة الأول ❤️");
        return;
    }

    localStorage.setItem("giftName", giftName);
    localStorage.setItem("giftPassword", giftPassword);
    localStorage.setItem("giftMessage", giftMessage);

    document.getElementById("create").style.display = "none";
    document.getElementById("open").style.display = "block";
}


function openGift() {

    const enteredPassword =
        document.getElementById("passwordCheck").value;

    const savedPassword =
        localStorage.getItem("giftPassword");

    if (enteredPassword !== savedPassword) {
        alert("الباسورد غلط 🔐");
        return;
    }

    document.getElementById("open").style.display = "none";
    document.getElementById("gift").style.display = "block";

    document.getElementById("nameShow").textContent =
        "إلى " + localStorage.getItem("giftName") + " 💗";

    document.getElementById("message").textContent =
        localStorage.getItem("giftMessage");
}


function shareGift() {

    if (navigator.share) {

        navigator.share({
            title: "عندك هدية 🎁",
            text: "حد عملك هدية خاصة 💗",
            url: window.location.href
        });

    } else {

        navigator.clipboard.writeText(window.location.href);

        alert("تم نسخ رابط الهدية 💌");

    }
}

</script>

</body>
</html>
