<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اصنع هديتك 🎁</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: center;
            background: linear-gradient(135deg, #ffe6f2, #f3e5ff);
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            color: #9b59b6;
        }

        input, textarea {
            width: 90%;
            box-sizing: border-box;
            padding: 14px;
            margin: 10px;
            border: 2px solid #ead5f5;
            border-radius: 15px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            background: #9b59b6;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 25px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>اصنعي هديتك 🎁💗</h1>

    <input id="name" type="text" placeholder="اسم الشخص 🎀">

    <input id="occasion" type="text" placeholder="مناسبة الهدية 🎉">

    <textarea id="message" placeholder="اكتبي رسالتك 💌"></textarea>

    <input id="password" type="password" placeholder="اعملي باسورد للهدية 🔐">

    <br>

    <button onclick="createGift()">إنشاء الهدية 🎁</button>

</div>

<script>
function createGift() {

    const name = document.getElementById("name").value;
    const occasion = document.getElementById("occasion").value;
    const message = document.getElementById("message").value;
    const password = document.getElementById("password").value;

    if (!name || !message || !password) {
        alert("اكتبي الاسم والرسالة والباسورد الأول 💗");
        return;
    }

    localStorage.setItem("giftPassword", password);

    window.location.href =
        "gift.html?name=" + encodeURIComponent(name) +
        "&occasion=" + encodeURIComponent(occasion) +
        "&message=" + encodeURIComponent(message);
}
</script>

</body>
</html>
