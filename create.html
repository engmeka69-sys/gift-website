<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية ليكي 🎁</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            text-align: center;
            direction: rtl;
            background: linear-gradient(135deg, #ffe6f2, #f3e5ff);
        }

        .gift {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            color: #9b59b6;
        }

        #message {
            font-size: 19px;
            line-height: 1.8;
            margin: 25px 0;
        }

        button {
            background: #9b59b6;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="gift">

        <h1>🎁 هدية خاصة 💗</h1>

        <h2 id="name"></h2>

        <h3 id="occasion"></h3>

        <p id="message"></p>

        <button onclick="shareGift()">مشاركة الهدية 💌</button>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const name = params.get("name");
        const occasion = params.get("occasion");
        const message = params.get("message");

        document.getElementById("name").textContent =
            name ? "إلى " + name + " 💗" : "هدية خاصة 💗";

        document.getElementById("occasion").textContent =
            occasion ? "بمناسبة: " + occasion : "";

        document.getElementById("message").textContent =
            message || "أتمنى لكِ أجمل الأيام ✨";

        function shareGift() {
            const link = window.location.href;

            if (navigator.share) {
                navigator.share({
                    title: "هدية خاصة 🎁",
                    text: "عندك هدية خاصة 💗",
                    url: link
                });
            } else {
                navigator.clipboard.writeText(link)
                    .then(() => {
                        alert("تم نسخ رابط الهدية 💗🎁");
                    })
                    .catch(() => {
                        alert("افتحي الموقع من المتصفح وجربي المشاركة مرة تانية.");
                    });
            }
        }
    </script>

</body>
</html>
