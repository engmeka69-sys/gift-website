<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحتي 🎁</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #e8d7ff);
            direction: rtl;
        }

        header {
            padding: 25px;
            text-align: center;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .content {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        .welcome {
            background: white;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .welcome h2 {
            color: #d94f8a;
        }

        .create {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 30px;
            border: none;
            border-radius: 15px;
            background: #d94f8a;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            font-size: 18px;
        }

        .emoji {
            font-size: 45px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎁 لوحة الهدايا</h1>
    </header>

    <div class="content">

        <div class="welcome">
            <h2>أهلًا بيكي 💗</h2>

            <p>
                هنا تقدري تعملي هدية مميزة وتبعتيها لصاحبتك ✨
            </p>

            <button class="create" onclick="window.location.href='create.html'">
    اصنع هدية جديدة 🎁
</button>
        </div>

        <div class="cards">

            <div class="card">
                <div class="emoji">🎁</div>
                صندوق هدية
            </div>

            <div class="card">
                <div class="emoji">💌</div>
                رسالة
            </div>

            <div class="card">
                <div class="emoji">📸</div>
                ألبوم صور
            </div>

            <div class="card">
                <div class="emoji">🎂</div>
                عيد ميلاد
            </div>

        </div>

    </div>

</body>
</html>
