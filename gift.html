<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>هدية 💗🎁</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #e8d7ff);
            direction: rtl;
            padding: 20px;
        }

        .gift {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px 30px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .icon {
            font-size: 80px;
        }

        h1 {
            color: #d94f8a;
            margin-bottom: 10px;
        }

        .occasion {
            color: #888;
            font-size: 18px;
        }

        .message {
            margin-top: 25px;
            padding: 25px;
            background: #fff0f6;
            border-radius: 20px;
            color: #555;
            font-size: 20px;
            line-height: 1.8;
        }

        button {
            margin-top: 25px;
            padding: 13px 25px;
            border: none;
            border-radius: 15px;
            background: #d94f8a;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }
        .heart {
    position: fixed;
    font-size: 25px;
    animation: float 4s linear infinite;
    pointer-events: none;
}

@keyframes float {
    0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-20vh) rotate(360deg);
        opacity: 0;
    }
}

.gift {
    animation: appear 0.8s ease;
}

@keyframes appear {
    from {
        transform: scale(0.8);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

.share-btn {
    background: #9b59b6;
    margin-top: 10px;
}
body {
    background: linear-gradient(135deg, #ffe6f2, #f3e5ff);
}

.gift {
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    border-radius: 25px;
    padding: 25px;
}

button {
    border: none;
    border-radius: 25px;
    padding: 12px 25px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
    </style>
</head>

<body>
<div class="heart" style="right:10%; animation-delay:0s;">💗</div>
<div class="heart" style="right:30%; animation-delay:1s;">💕</div>
<div class="heart" style="right:50%; animation-delay:2s;">💖</div>
<div class="heart" style="right:70%; animation-delay:0.5s;">💗</div>
<div class="heart" style="right:90%; animation-delay:1.5s;">✨</div>
    <div class="gift">

        <div class="icon">🎁</div>
<img id="giftPhoto" style="display:none; width:100%; max-height:350px; object-fit:cover; border-radius:20px; margin:20px 0;">
        <h1 id="name">هدية خاصة 💗</h1>

        <div class="occasion" id="occasion"></div>

        <div class="message" id="message"></div>

        
<button class="share-btn" onclick="copyGiftLink()">
    مشاركة الهدية 💌
</button>

<button onclick="window.location.href='dashboard.html'">
    العودة للوحة الهدايا 🎁
</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const name = params.get("name");
        const occasion = params.get("occasion");
        const message = params.get("message");

        document.getElementById("name").textContent =
            name ? "إلى " + name + " 💗" : "هدية خاصة 💗";

        document.getElementById("occasion").textContent =
            occasion ? "بمناسبة: " + occasion : "";

        document.getElementById("message").textContent =
            message || "أتمنى لكِ أجمل الأيام ✨";
            function copyGiftLink() {
    navigator.clipboard.writeText(window.location.href)
        .then(() => {
            alert("تم نسخ رابط الهدية 💗🎁");
        });
    </script>
const savedPhoto = localStorage.getItem("giftPhoto");

if (savedPhoto) {
    const photo = document.getElementById("giftPhoto");
    photo.src = savedPhoto;
    photo.style.display = "block";
}
<div id="hearts"></div>

<script>
function createHeart() {
    const heart = document.createElement("div");

    const hearts = ["💗", "💕", "💖", "💓", "✨"];
    heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.position = "fixed";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "-40px";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";
    heart.style.zIndex = "9999";
    heart.style.pointerEvents = "none";

    heart.animate(
        [
            {
                transform: "translateY(0) rotate(0deg)",
                opacity: 1
            },
            {
                transform: "translateY(-110vh) rotate(360deg)",
                opacity: 0
            }
        ],
        {
            duration: 3500 + Math.random() * 2000,
            easing: "linear"
        }
    );

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5500);
}

for (let i = 0; i < 15; i++) {
    setTimeout(createHeart, i * 150);
}

setInterval(createHeart, 700);
</script>
<div id="giftBox" onclick="openGift()">
    <div class="box-lid">🎀</div>
    <div class="box-body">🎁</div>
    <p>اضغطي عليا 💗</p>
</div>

<style>
#giftBox {
    text-align: center;
    cursor: pointer;
    margin: 30px auto;
    animation: bounce 1.5s infinite;
}

#giftBox .box-lid {
    font-size: 70px;
}

#giftBox .box-body {
    font-size: 90px;
    margin-top: -25px;
}

#giftBox p {
    font-size: 18px;
    color: #9b59b6;
    font-weight: bold;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

.gift-opened {
    animation: openBox 0.7s ease;
}

@keyframes openBox {
    0% { transform: scale(1); }
    50% { transform: scale(1.3) rotate(5deg); }
    100% { transform: scale(1); }
}
</style>

<script>
function openGift() {
    const box = document.getElementById("giftBox");

    box.classList.add("gift-opened");

    for (let i = 0; i < 30; i++) {
        setTimeout(createHeart, i * 70);
    }

    setTimeout(() => {
        box.innerHTML = "💝<p>الهدية اتفتحت! 💗</p>";
        box.classList.remove("gift-opened");
    }, 700);
}
</script>
</body>
</html>
