<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Website 🎁</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #e8d7ff);
            direction: rtl;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 45px 30px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .gift {
            font-size: 80px;
            animation: float 2s infinite ease-in-out;
        }

        h1 {
            color: #d94f8a;
            font-size: 32px;
            margin: 15px 0;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.7;
        }

        button {
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            background: #d94f8a;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            transform: scale(1.05);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="gift">🎁</div>

        <h1>اصنع هدية مميزة لصاحبك 💗</h1>

        <p>
            اختار الصور والرسالة والتصميم،
            واعمل مفاجأة مميزة لشخص بتحبه كصديق ✨
        </p><button onclick="window.location.href='signup.html'">ابدأ الآن ✨</button>

        

    </div>

</body>
</html>
