<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب 🎁</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #e8d7ff);
            direction: rtl;
        }

        .box {
            width: 90%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .icon {
            font-size: 65px;
        }

        h1 {
            color: #d94f8a;
        }

        p {
            color: #666;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 2px solid #f0c2d5;
            border-radius: 15px;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 15px;
            background: #d94f8a;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="icon">🎁</div>

        <h1>أهلًا بيكي 💗</h1>

        <p>اعملي حساب وابدئي<p>اعملي حساب وابدئي رحلتك في عالم الهدايا ✨</p>

<input type="text" placeholder="اسمك">

<input type="email" placeholder="البريد الإلكتروني">

<input type="password" placeholder="كلمة المرور">

<button onclick="window.location.href='dashboard.html'">
    إنشاء حساب ✨
</button>

</div>

</body>
</html>
